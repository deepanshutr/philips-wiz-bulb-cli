version: 2
project_name: philips-wiz-bulb-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: philips-wiz-bulb
    main: ./cmd/philips-wiz-bulb
    binary: philips-wiz-bulb
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
